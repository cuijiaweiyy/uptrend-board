name: 每日更新上升途中看板

on:
  schedule:
    # 周一至周五，A股收盘后（北京时间 15:30 / 20:00）各跑一次
    # GitHub Actions 用 UTC：15:30 CST = 07:30 UTC，20:00 CST = 12:00 UTC
    - cron: "30 7 * * 1-5"
    - cron: "0 12 * * 1-5"
  workflow_dispatch: # 允许在网页上手动点「Run workflow」立即跑一次

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 配置 Node（问财反爬 token 需要）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行流水线（抓数据 → 统计 → 生成看板）
        id: pipeline
        continue-on-error: true
        run: python pipeline.py

      - name: 流水线结果判定
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::warning::本次流水线失败，已保留上一次的看板页面（不受影响）"
          exit 0

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 更新看板 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
